version: '3.8'

services:
  self-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: self-rag-dev
    ports:
      - "5000:5000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - FLASK_ENV=development
      - AWS_REGION=us-east-1
      - S3_DOCUMENTS_BUCKET=self-rag-documents-dev
    volumes:
      # Mount source code for development
      - ./templates:/app/templates
      - ./static:/app/static
      - ./embedding_service.py:/app/embedding_service.py
      - ./flask_app.py:/app/flask_app.py
      - ./self_rag_pipeline.py:/app/self_rag_pipeline.py
    networks:
      - self-rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Optional: Add Redis for session persistence
  redis:
    image: redis:7-alpine
    container_name: self-rag-redis
    ports:
      - "6379:6379"
    networks:
      - self-rag-network
    volumes:
      - redis_data:/data
    restart: unless-stopped

networks:
  self-rag-network:
    driver: bridge

volumes:
  redis_data:
